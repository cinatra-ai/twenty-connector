name: truthful-attribution-gate
# Thin caller for the org-reusable truthful-attribution-gate (cinatra-ai/ci),
# per the ratified truthful-attribution spec. WARN mode (rollout): findings are
# annotated, the check is ALWAYS green - it never fails a PR.
#
# Double-pinned: the `uses:` ref and the `ref` input below name the SAME
# cinatra-ai/ci commit (1e40675e), and .github/gate-suite.json names that commit
# as the `pinned` engine of this context's requiredContexts row - move all three
# in one commit. That commit carries no tag. The actions pin gate requires a
# comment of the form `# v<number>` on the uses: line, so that comment is a bare
# `v0` with the engine's short sha as build metadata; it claims no tag.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is MANDATORY: the engine (since 8eede102) resolves a reusable-workflow
  # check-run to its Actions run (GET /actions/runs/{id}) to verify referenced_workflows[]
  # at the pinned SHA. With an explicit permissions block, any omitted scope defaults
  # to `none`, and a called reusable workflow cannot exceed the caller's grant — so
  # omitting this causes startup_failure (red/missing check), which WARN mode CANNOT
  # rescue (it fails before any step runs). Do not drop this line.
  actions: read

jobs:
  truthful-attribution-gate:                 # caller job id MUST stay this exact string
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@1e40675e1642dcc32d195f27b3deb285b4d3d6fc # v0+engine.1e40675e.grant.2
    with:
      mode: warn
      ref: 1e40675e1642dcc32d195f27b3deb285b4d3d6fc # engine 1e40675e, grant revision 2 (the pin the application's suite carries)
